# swf factory: reusable workflow called from each project repo.
#
# Trigger lives in the caller (issue labeled `swf:ready`). This workflow:
#   1. worker:   builds the ticket and opens a PR, or, if the ticket already has an open swf PR,
#                addresses its latest review (fix mode)
#   2. reviewer: reviews the PR with fresh context and gives a verdict (never pushes)
#   3. fix:      only after a fresh build that got "needs changes": one automatic fix round
#   4. review-2: reviews the fix. Still "needs changes" stops at swf:changes-requested for the owner
#
# A manual `swf:ready` on a ticket with an open PR runs steps 1 and 2 in fix mode, with no
# automatic round after it.

name: swf factory

on:
  workflow_call:
    inputs:
      issue_number:
        description: Issue to work on
        type: number
        required: true
      test_command:
        description: Command that runs the full test suite, from the repo root
        type: string
        required: true
      go_version_file:
        description: Path to go.mod, to set up Go. Leave empty to skip
        type: string
        default: ""
      extra_allowed_tools:
        description: Extra Claude tools to allow, comma separated (build and test tools)
        type: string
        default: "Bash(go:*),Bash(gofmt:*),Bash(cd:*)"
      worker_max_turns:
        type: number
        default: 80
      reviewer_max_turns:
        type: number
        default: 30
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

concurrency:
  group: swf-${{ github.repository }}-${{ inputs.issue_number }}
  cancel-in-progress: false

jobs:
  worker:
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    uses: MarlonBando/swf/.github/workflows/worker.yml@main
    with:
      issue_number: ${{ inputs.issue_number }}
      mode: auto
      test_command: ${{ inputs.test_command }}
      go_version_file: ${{ inputs.go_version_file }}
      extra_allowed_tools: ${{ inputs.extra_allowed_tools }}
      max_turns: ${{ inputs.worker_max_turns }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  reviewer:
    needs: worker
    if: needs.worker.outputs.pr_number != ''
    permissions:
      contents: read
      issues: write
      pull-requests: write
      id-token: write
    uses: MarlonBando/swf/.github/workflows/reviewer.yml@main
    with:
      issue_number: ${{ inputs.issue_number }}
      pr_number: ${{ fromJSON(needs.worker.outputs.pr_number) }}
      fix_follows: ${{ needs.worker.outputs.mode == 'build' }}
      max_turns: ${{ inputs.reviewer_max_turns }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  fix:
    needs: [worker, reviewer]
    if: needs.worker.outputs.mode == 'build' && needs.reviewer.outputs.verdict == 'needs_changes'
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    uses: MarlonBando/swf/.github/workflows/worker.yml@main
    with:
      issue_number: ${{ inputs.issue_number }}
      mode: fix
      test_command: ${{ inputs.test_command }}
      go_version_file: ${{ inputs.go_version_file }}
      extra_allowed_tools: ${{ inputs.extra_allowed_tools }}
      max_turns: ${{ inputs.worker_max_turns }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  review-2:
    needs: fix
    if: needs.fix.outputs.pr_number != ''
    permissions:
      contents: read
      issues: write
      pull-requests: write
      id-token: write
    uses: MarlonBando/swf/.github/workflows/reviewer.yml@main
    with:
      issue_number: ${{ inputs.issue_number }}
      pr_number: ${{ fromJSON(needs.fix.outputs.pr_number) }}
      fix_follows: false
      max_turns: ${{ inputs.reviewer_max_turns }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
