# swf worker: called by factory.yml, never directly by a project.
#
# Two modes:
#   build: implement the ticket on a new branch and open a PR.
#   fix:   check out the ticket's open PR, address the latest review, push to the same branch.
# Mode "auto" means fix if the ticket already has an open swf PR, build otherwise.

name: swf worker

on:
  workflow_call:
    inputs:
      issue_number:
        type: number
        required: true
      mode:
        description: auto, build or fix
        type: string
        default: auto
      test_command:
        type: string
        required: true
      go_version_file:
        type: string
        default: ""
      extra_allowed_tools:
        type: string
        default: "Bash(go:*),Bash(gofmt:*),Bash(cd:*)"
      max_turns:
        type: number
        default: 80
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
    outputs:
      mode:
        description: The mode that actually ran (build or fix)
        value: ${{ jobs.worker.outputs.mode }}
      pr_number:
        description: PR opened or updated, empty if none
        value: ${{ jobs.worker.outputs.pr_number }}

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      pr_number: ${{ steps.finalize.outputs.pr_number }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      ISSUE: ${{ inputs.issue_number }}
    steps:
      - name: Mark issue in progress
        run: |
          gh issue edit "$ISSUE" -R "$REPO" --add-label swf:in-progress
          for l in swf:ready swf:needs-info swf:failed swf:backlog swf:in-review swf:changes-requested; do
            gh issue edit "$ISSUE" -R "$REPO" --remove-label "$l" 2>/dev/null || true
          done

      - name: Pick mode
        id: mode
        env:
          MODE: ${{ inputs.mode }}
        run: |
          pr=$(gh pr list -R "$REPO" --state open --limit 100 --json number,headRefName \
            --jq "[.[] | select(.headRefName | startswith(\"swf/$ISSUE-\"))][0] // empty | \"\(.number) \(.headRefName)\"")
          if [ "$MODE" = auto ]; then
            if [ -n "$pr" ]; then MODE=fix; else MODE=build; fi
          fi
          if [ "$MODE" = fix ] && [ -z "$pr" ]; then
            echo "Fix mode needs an open swf/$ISSUE-* PR, found none." >&2
            exit 1
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "pr_number=${pr%% *}" >> "$GITHUB_OUTPUT"
          echo "branch=${pr#* }" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE pr=$pr"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.mode.outputs.mode == 'fix' && steps.mode.outputs.branch || '' }}
          fetch-depth: 0

      - name: Set up Go
        if: inputs.go_version_file != ''
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.go_version_file }}

      - name: Install pre-push hook (tests must pass before any push)
        env:
          TEST_COMMAND: ${{ inputs.test_command }}
        run: |
          {
            echo '#!/usr/bin/env bash'
            echo 'set -euo pipefail'
            echo 'cd "$(git rev-parse --show-toplevel)"'
            echo 'echo "swf pre-push: running test suite"'
            printf '%s\n' "$TEST_COMMAND"
          } > .git/hooks/pre-push
          chmod +x .git/hooks/pre-push
          cat .git/hooks/pre-push

      - name: Worker (build)
        id: build
        if: steps.mode.outputs.mode == 'build'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are the worker of swf, a personal software factory.
            REPO: ${{ github.repository }}
            ISSUE NUMBER: ${{ inputs.issue_number }}
            DEFAULT BRANCH: ${{ github.event.repository.default_branch }}
            TEST COMMAND: ${{ inputs.test_command }}

            1. Read the issue and every comment: `gh issue view ${{ inputs.issue_number }} --comments`.
               Tickets have a Goal, Acceptance criteria and Out of scope. Later comments may answer
               earlier questions. Read the repo's README and CLAUDE.md if present.

            2. If the ticket is ambiguous or you need a decision only the owner can make, do NOT
               write code. Post your questions as one numbered list with
               `gh issue comment ${{ inputs.issue_number }} --body "..."`, then finish with
               status "needs_info".

            3. Otherwise create a branch: `git checkout -b swf/${{ inputs.issue_number }}-<short-kebab-slug>`.
               Implement exactly what the ticket asks. Respect Out of scope. Match the existing style.
               Add or update tests for the behavior you change.

            4. Run the full test suite with the TEST COMMAND and fix until it passes.
               A pre-push hook also runs it and blocks the push if it fails. Never bypass the hook.

            5. Commit with clear messages, then `git push -u origin HEAD`.

            6. Open the PR against the default branch with `gh pr create`. The body must have:
               a short summary, how each acceptance criterion is met, how you tested it,
               and the line `Closes #${{ inputs.issue_number }}`. Finish with status "pr_opened"
               and the PR number.

            If you cannot get the tests to pass or cannot finish, do not open a PR. Comment on the
            issue with what you tried and what failed, then finish with status "failed".
          claude_args: |
            --max-turns ${{ inputs.max_turns }}
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(git:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh pr create:*),Bash(gh pr view:*),${{ inputs.extra_allowed_tools }}"
            --disallowedTools "Bash(git push --no-verify:*),Bash(git push --force:*),Bash(git push -f:*),Bash(git -c:*)"
            --json-schema '{"type":"object","properties":{"status":{"type":"string","enum":["pr_opened","needs_info","failed"]},"pr_number":{"type":"integer"},"summary":{"type":"string"}},"required":["status","summary"]}'

      - name: Worker (fix)
        id: fix
        if: steps.mode.outputs.mode == 'fix'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are the worker of swf, a personal software factory. Your PR for this ticket got
            review feedback. Address it.
            REPO: ${{ github.repository }}
            ISSUE NUMBER: ${{ inputs.issue_number }}
            PR NUMBER: ${{ steps.mode.outputs.pr_number }}
            PR BRANCH: ${{ steps.mode.outputs.branch }} (already checked out)
            TEST COMMAND: ${{ inputs.test_command }}

            1. Read the ticket (`gh issue view ${{ inputs.issue_number }} --comments`), then the PR with
               its reviews and comments (`gh pr view ${{ steps.mode.outputs.pr_number }} --comments`)
               and the current diff (`gh pr diff ${{ steps.mode.outputs.pr_number }}`).
               The latest review is the one to address. Comments from the repo owner take priority
               over the reviewer's.

            2. Fix every finding that is correct and within the ticket's scope. If a finding is
               wrong or out of scope, don't change the code for it: explain why in your PR comment.
               If a finding needs a decision only the owner can make, post the question on the issue
               with `gh issue comment`, and finish with status "needs_info" without pushing.

            3. Run the full test suite with the TEST COMMAND and fix until it passes.
               A pre-push hook also runs it and blocks the push if it fails. Never bypass the hook.

            4. Commit with clear messages and `git push` to the same branch. Never force push,
               never rebase or rewrite existing commits, never open a new PR.

            5. Comment on the PR with `gh pr comment ${{ steps.mode.outputs.pr_number }} --body "..."`:
               one line per finding, saying what you changed or why you didn't.
               Finish with status "pr_updated" and the PR number.

            If you cannot get the tests to pass, don't push. Comment on the PR with what you tried and
            what failed, then finish with status "failed".
          claude_args: |
            --max-turns ${{ inputs.max_turns }}
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(git:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),${{ inputs.extra_allowed_tools }}"
            --disallowedTools "Bash(git push --no-verify:*),Bash(git push --force:*),Bash(git push -f:*),Bash(git push --force-with-lease:*),Bash(git rebase:*),Bash(git reset --hard:*),Bash(git -c:*),Bash(gh pr create:*)"
            --json-schema '{"type":"object","properties":{"status":{"type":"string","enum":["pr_updated","needs_info","failed"]},"pr_number":{"type":"integer"},"summary":{"type":"string"}},"required":["status","summary"]}'

      - name: Update labels
        id: finalize
        if: always()
        env:
          OUT: ${{ steps.build.outputs.structured_output || steps.fix.outputs.structured_output }}
          FIX_PR: ${{ steps.mode.outputs.pr_number }}
          MODE: ${{ steps.mode.outputs.mode }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          OUT=${OUT:-'{}'}
          status=$(printf '%s' "$OUT" | jq -r '.status // "crashed"' 2>/dev/null || echo crashed)
          pr=$(printf '%s' "$OUT" | jq -r '.pr_number // empty' 2>/dev/null || true)
          [ "$MODE" = fix ] && pr=$FIX_PR
          echo "mode=$MODE status=$status pr=$pr"
          gh issue edit "$ISSUE" -R "$REPO" --remove-label swf:in-progress || true
          case "$status" in
            pr_opened|pr_updated)
                        gh issue edit "$ISSUE" -R "$REPO" --add-label swf:in-review
                        echo "pr_number=$pr" >> "$GITHUB_OUTPUT" ;;
            needs_info) gh issue edit "$ISSUE" -R "$REPO" --add-label swf:needs-info ;;
            failed)     gh issue edit "$ISSUE" -R "$REPO" --add-label swf:failed ;;
            *)          gh issue edit "$ISSUE" -R "$REPO" --add-label swf:failed
                        gh issue comment "$ISSUE" -R "$REPO" --body "swf worker stopped before finishing. Logs: $RUN_URL" ;;
          esac
